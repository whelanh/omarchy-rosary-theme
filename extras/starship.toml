# Rosary prompt — antique gold, parchment and ultramarine ink.
#   ╭─ [ ~/code/rosary ]  main ✚                    ✝ 22:14
#   ╰─✝
# The cross takes the colour of the Passion when the last command failed.

add_newline = true
command_timeout = 200
palette = "rosary"

format = """
[╭─](stone)\
[](fg:stone bg:parchment)$directory[](fg:stone)\
$git_branch$git_status\
$python$nodejs$rust\
$fill\
$cmd_duration$time
[╰─](stone)$character"""

[palettes.rosary]
ink = "#0b0d15"
night = "#181c2b"
stone = "#847d6e"
parchment = "#e9dfcc"
ivory = "#fbf6ea"
gold = "#d9b45b"
goldpale = "#efd28c"
golddeep = "#a67c2e"
oxblood = "#c25b62"
olive = "#8fa286"
ultramarine = "#6f8fc9"
plum = "#c9a2c1"

[fill]
symbol = " "

[character]
success_symbol = "[✝](bold gold)"
error_symbol = "[✝](bold oxblood)"
vimcmd_symbol = "[✝](bold ultramarine)"

[directory]
style = "bold fg:ink bg:parchment"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " 󰌾 "
read_only_style = "fg:ink bg:parchment"
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold fg:ink bg:parchment"
repo_root_format = "[ $repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "fg:gold bg:night"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:plum bg:night"
format = "[($all_status$ahead_behind )]($style)"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "= "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
stashed = ""
renamed = ""
deleted = "✘${count} "

[python]
symbol = " "
style = "fg:olive"
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = " "
style = "fg:olive"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:golddeep"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "fg:stone"
format = "[took $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:gold"
format = "[✝ $time]($style)"
